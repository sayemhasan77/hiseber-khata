<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসেবের খাতা - প্রিমিয়াম মেস ম্যানেজমেন্ট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        
        :root {
            --sky-primary: #0EA5E9;
            --sky-light: #F0F9FF;
            --sky-border: #E0F2FE;
            --text-main: #0F172A;
        }

        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: #F8FAFC;
            color: var(--text-main);
        }

        .premium-card {
            background: #FFFFFF;
            border: 1px solid var(--sky-border);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            margin: 4px 0;
            border-radius: 12px;
            color: #64748B;
            transition: all 0.2s;
            font-weight: 500;
        }

        .active-nav {
            background-color: var(--sky-primary) !important;
            color: white !important;
        }

        input, select {
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            padding: 10px 16px;
            border-radius: 12px;
            outline: none;
        }

        .btn-action {
            background-color: var(--sky-primary);
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Notification Toast */
        #systemNotice {
            display: none;
            animation: fadeInDown 0.5s;
        }
    </style>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-white z-[100] flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-10">
                <div class="w-14 h-14 bg-sky-500 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
                    <i class="fas fa-feather-alt text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">হিসেবের খাতা</h2>
            </div>

            <div class="bg-slate-50 p-6 rounded-[2.5rem] border border-slate-100">
                <div class="flex bg-white p-1 rounded-xl mb-6 border border-slate-100">
                    <button id="loginTab" onclick="toggleAuthMode('login')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-sky-500 text-white">লগইন</button>
                    <button id="registerTab" onclick="toggleAuthMode('register')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500">নতুন আইডি</button>
                </div>

                <div class="space-y-4">
                    <input type="text" id="messId" placeholder="মেস আইডি" class="w-full">
                    <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" class="w-full">
                    <input type="password" id="confirmPass" placeholder="কনফার্ম পাসওয়ার্ড" class="w-full hidden">
                    <button id="authActionBtn" onclick="handleAuth()" class="w-full btn-action">প্রবেশ করুন</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="mainDashboard" class="hidden flex flex-col md:flex-row h-screen overflow-hidden">
        
        <!-- PC Sidebar -->
        <aside class="hidden md:flex w-64 bg-white border-r border-slate-100 flex-col p-6">
            <div class="flex items-center space-x-3 mb-10">
                <span class="text-xl font-bold">হিসেবের খাতা</span>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showSection('summary')" id="pc-summary" class="sidebar-btn w-full active-nav"><i class="fas fa-home-alt mr-3"></i>ড্যাশবোর্ড</button>
                <button onclick="showSection('meals')" id="pc-meals" class="sidebar-btn w-full"><i class="fas fa-utensils mr-3"></i>মিল এন্ট্রি</button>
                <button onclick="showSection('market')" id="pc-market" class="sidebar-btn w-full"><i class="fas fa-shopping-bag mr-3"></i>বাজার খরচ</button>
                <button onclick="showSection('settings')" id="pc-settings" class="sidebar-btn w-full"><i class="fas fa-cog mr-3"></i>সেটিংস</button>
            </nav>
            <div class="mt-auto pt-6 border-t">
                <button onclick="logout()" class="text-red-500 font-bold px-2"><i class="fas fa-power-off mr-3"></i>লগআউট</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 pb-24">
            
            <!-- System Notice Board -->
            <div id="systemNotice" class="mb-6 bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl shadow-sm">
                <div class="flex items-center">
                    <i class="fas fa-bullhorn text-amber-500 mr-3"></i>
                    <div>
                        <p class="text-xs font-bold text-amber-600 uppercase">অ্যাডমিন নোটিশ</p>
                        <p id="noticeContent" class="text-sm text-amber-800">আজকের মিল রেট আপডেট করা হয়েছে।</p>
                    </div>
                </div>
            </div>

            <!-- Summary Section -->
            <section id="summary-section" class="section-content">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">মাসের সামারি</h2>
                    </div>
                    <button onclick="exportToPDF()" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center">
                        <i class="fas fa-file-pdf mr-2"></i> PDF ডাউনলোড
                    </button>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div class="premium-card p-5 border-b-4 border-b-sky-500">
                        <p class="text-slate-400 text-xs font-bold uppercase">মোট বাজার</p>
                        <h3 class="text-xl font-bold">৳<span id="totalMarketDisplay">0</span></h3>
                    </div>
                    <div class="premium-card p-5 border-b-4 border-b-emerald-500">
                        <p class="text-slate-400 text-xs font-bold uppercase">মিল রেট</p>
                        <h3 class="text-xl font-bold">৳<span id="mealRateDisplay">0</span></h3>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                    <table class="w-full text-sm" id="summaryTable">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-4 text-left">মেম্বার</th>
                                <th class="p-4 text-center">মিল</th>
                                <th class="p-4 text-center">ব্যালেন্স</th>
                            </tr>
                        </thead>
                        <tbody id="personalSummaryTable"></tbody>
                    </table>
                </div>
            </section>

            <!-- Settings Section -->
            <section id="settings-section" class="section-content hidden">
                <h2 class="text-2xl font-bold mb-6">সেটিংস ও প্রোফাইল</h2>
                
                <div class="grid gap-6 max-w-lg">
                    <!-- Password Change -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-100">
                        <h3 class="font-bold mb-4"><i class="fas fa-lock mr-2"></i>পাসওয়ার্ড পরিবর্তন</h3>
                        <div class="space-y-3">
                            <input type="password" id="newPassInput" placeholder="নতুন পাসওয়ার্ড" class="w-full">
                            <button onclick="updatePassword()" class="btn-action w-full">আপডেট করুন</button>
                        </div>
                    </div>

                    <!-- Admin Notice Board -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-100">
                        <h3 class="font-bold mb-4"><i class="fas fa-edit mr-2"></i>সিস্টেম নোটিশ (অ্যাডমিন)</h3>
                        <textarea id="adminNoticeInput" class="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none" placeholder="মেম্বারদের জন্য কোনো মেসেজ লিখুন..."></textarea>
                        <button onclick="updateNotice()" class="btn-action w-full mt-3">নোটিশ পাবলিশ করুন</button>
                    </div>

                    <!-- Logout Card for Mobile -->
                    <div class="md:hidden bg-red-50 p-6 rounded-2xl border border-red-100 text-center">
                        <p class="text-red-600 font-bold mb-3">আপনি কি লগআউট করতে চান?</p>
                        <button onclick="logout()" class="bg-red-500 text-white px-8 py-2 rounded-xl font-bold">লগআউট</button>
                    </div>
                </div>
            </section>

            <!-- Meals, Market sections omitted for brevity but remain functional as per original logic -->
            <section id="meals-section" class="section-content hidden">
                <h2 class="text-2xl font-bold mb-6">মিল এন্ট্রি</h2>
                <div class="bg-white p-6 rounded-2xl border border-slate-100 max-w-md">
                    <input type="date" id="mealDate" class="w-full mb-4">
                    <div id="mealEntryList" class="space-y-3"></div>
                    <button onclick="saveDailyMeals()" class="btn-action w-full mt-6">সেভ করুন</button>
                </div>
            </section>

            <section id="market-section" class="section-content hidden">
                <h2 class="text-2xl font-bold mb-6">বাজার খরচ</h2>
                <div class="flex gap-2 mb-6">
                    <select id="marketMemberSelect" class="flex-1"></select>
                    <input type="number" id="marketAmount" placeholder="টাকা" class="w-32">
                    <button onclick="addMarket()" class="btn-action">অ্যাড</button>
                </div>
                <div id="marketTableBody" class="grid gap-3"></div>
            </section>

        </main>

        <!-- Mobile Nav Bar -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 z-50">
            <button onclick="showSection('summary')" class="flex flex-col items-center p-2 text-sky-500"><i class="fas fa-home"></i><span class="text-[10px]">হোম</span></button>
            <button onclick="showSection('meals')" class="flex flex-col items-center p-2 text-slate-400"><i class="fas fa-utensils"></i><span class="text-[10px]">মিল</span></button>
            <button onclick="showSection('market')" class="flex flex-col items-center p-2 text-slate-400"><i class="fas fa-shopping-cart"></i><span class="text-[10px]">বাজার</span></button>
            <button onclick="showSection('settings')" class="flex flex-col items-center p-2 text-slate-400"><i class="fas fa-cog"></i><span class="text-[10px]">সেটিংস</span></button>
        </nav>
    </div>

    <!-- Firebase Scripts (Same as original) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Use your existing firebaseConfig
        const firebaseConfig = {
            apiKey: "AIzaSyBB02NmJpHi0WS8wUv_JwGZ_scsRRNx7GA",
            authDomain: "hiseber-khata-743e5.firebaseapp.com",
            databaseURL: "https://hiseber-khata-743e5-default-rtdb.firebaseio.com",
            projectId: "hiseber-khata-743e5",
            storageBucket: "hiseber-khata-743e5.firebasestorage.app",
            messagingSenderId: "167663336335",
            appId: "1:167663336335:web:02482be99a86f90bffa9fa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentMessId = "";
        let authMode = 'login';
        let localData = { members: [], market: [], dailyMeals: {}, otherExpenses: [], deposits: [], systemNotice: "" };

        // --- NEW FEATURES ---

        function toggleAuthMode(mode) {
            authMode = mode;
            document.getElementById('confirmPass').classList.toggle('hidden', mode === 'login');
            document.getElementById('authActionBtn').innerText = mode === 'login' ? 'প্রবেশ করুন' : 'আইডি খুলুন';
            // Styling tabs
            document.getElementById('loginTab').className = mode === 'login' ? 'flex-1 py-2 text-sm font-bold rounded-lg bg-sky-500 text-white' : 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500';
            document.getElementById('registerTab').className = mode === 'register' ? 'flex-1 py-2 text-sm font-bold rounded-lg bg-sky-500 text-white' : 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-500';
        }

        async function handleAuth() {
            const id = document.getElementById('messId').value.trim().toLowerCase();
            const pass = document.getElementById('adminPass').value;
            const cPass = document.getElementById('confirmPass').value;

            if(!id || !pass) return alert("সব তথ্য দিন");

            if(authMode === 'register' && pass !== cPass) {
                return alert("পাসওয়ার্ড মেলেনি!");
            }

            const ref = db.ref('user_accounts/' + id);
            const snap = await ref.once('value');

            if(authMode === 'login') {
                if(snap.exists() && snap.val().pass === pass) startSession(id);
                else alert("ভুল আইডি বা পাসওয়ার্ড");
            } else {
                if(snap.exists()) alert("আইডিটি ইতিমধ্যে ব্যবহৃত");
                else { await ref.set({ pass: pass }); startSession(id); }
            }
        }

        function updatePassword() {
            const newPass = document.getElementById('newPassInput').value;
            if(newPass.length < 4) return alert("পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে");
            db.ref('user_accounts/' + currentMessId).update({ pass: newPass })
                .then(() => { alert("পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে"); document.getElementById('newPassInput').value = ""; });
        }

        function updateNotice() {
            const notice = document.getElementById('adminNoticeInput').value;
            db.ref('mess_storage/' + currentMessId).update({ systemNotice: notice })
                .then(() => { alert("নোটিশ আপডেট হয়েছে"); });
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Monthly Summary - " + currentMessId, 14, 15);
            doc.autoTable({ html: '#summaryTable', startY: 25 });
            doc.save(`Summary_${currentMessId}.pdf`);
        }

        // --- CORE LOGIC (INTEGRATED) ---

        function startSession(id) {
            currentMessId = id;
            localStorage.setItem('active_mess_id', id);
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            init();
        }

        function init() {
            db.ref('mess_storage/' + currentMessId).on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    localData = { ...localData, ...data };
                    // Handle Notice
                    if(localData.systemNotice) {
                        document.getElementById('systemNotice').style.display = 'block';
                        document.getElementById('noticeContent').innerText = localData.systemNotice;
                    } else {
                        document.getElementById('systemNotice').style.display = 'none';
                    }
                    refreshUI();
                }
            });
        }

        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
        }

        function refreshUI() {
            renderSummary();
            renderMarketList();
            renderMealList();
            updateSelects();
        }

        function renderSummary() {
            let totalMarket = localData.market.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);
            let totalMeals = 0;
            let mStats = {};

            localData.members.forEach(m => { mStats[m] = { meals: 0 }; });

            for(let date in localData.dailyMeals) {
                for(let m in localData.dailyMeals[date]) {
                    if(mStats[m]) {
                        mStats[m].meals += localData.dailyMeals[date][m];
                        totalMeals += localData.dailyMeals[date][m];
                    }
                }
            }

            let mealRate = totalMeals > 0 ? (totalMarket / totalMeals) : 0;
            document.getElementById('totalMarketDisplay').innerText = totalMarket;
            document.getElementById('mealRateDisplay').innerText = mealRate.toFixed(2);

            document.getElementById('personalSummaryTable').innerHTML = localData.members.map(m => `
                <tr>
                    <td class="p-4 font-bold border-b">${m}</td>
                    <td class="p-4 text-center border-b">${mStats[m].meals}</td>
                    <td class="p-4 text-center border-b font-bold">৳${(mStats[m].meals * mealRate).toFixed(1)}</td>
                </tr>
            `).join('');
        }

        function renderMarketList() {
            document.getElementById('marketTableBody').innerHTML = localData.market.map((m, i) => `
                <div class="bg-white p-4 rounded-xl border flex justify-between">
                    <span><b>${m.name}</b></span>
                    <span>৳${m.amount}</span>
                </div>
            `).join('');
        }

        function renderMealList() {
            const date = document.getElementById('mealDate').value || new Date().toISOString().split('T')[0];
            const meals = localData.dailyMeals[date] || {};
            document.getElementById('mealEntryList').innerHTML = localData.members.map(m => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                    <span class="font-medium">${m}</span>
                    <input type="number" step="0.5" value="${meals[m] || 0}" onchange="updateMealVal('${m}', this.value)" class="w-20 text-center">
                </div>
            `).join('');
        }

        function updateMealVal(m, v) {
            const date = document.getElementById('mealDate').value;
            if(!localData.dailyMeals[date]) localData.dailyMeals[date] = {};
            localData.dailyMeals[date][m] = parseFloat(v) || 0;
        }

        function addMarket() {
            const name = document.getElementById('marketMemberSelect').value;
            const amount = parseFloat(document.getElementById('marketAmount').value);
            if(amount > 0) {
                localData.market.push({ name, amount, date: new Date().toLocaleDateString() });
                saveData();
                document.getElementById('marketAmount').value = "";
            }
        }

        function saveData() { db.ref('mess_storage/' + currentMessId).set(localData); }
        function saveDailyMeals() { saveData(); alert("মিল সেভ হয়েছে"); }
        function logout() { localStorage.clear(); location.reload(); }
        function updateSelects() {
            const h = localData.members.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('marketMemberSelect').innerHTML = h;
        }

        window.onload = () => {
            const saved = localStorage.getItem('active_mess_id');
            if(saved) startSession(saved);
            document.getElementById('mealDate').valueAsDate = new Date();
        };
    </script>
</body>
</html>
