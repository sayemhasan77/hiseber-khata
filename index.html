<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসেবের খাতা - মেস ম্যানেজমেন্ট</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20 md:pb-0">

    <!-- Login Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-indigo-900 z-[100] flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center mb-2 text-indigo-800 italic">হিসেবের খাতা</h2>
            <p class="text-center text-gray-500 text-sm mb-6">আপনার মেস আইডি দিয়ে প্রবেশ করুন</p>
            
            <input type="text" id="messIdInput" placeholder="মেস আইডি (উদা: mess123)" class="w-full border-2 border-gray-200 p-3 rounded-xl mb-4 text-center focus:border-indigo-500 outline-none">
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড (1234)" class="w-full border-2 border-gray-200 p-3 rounded-xl mb-4 text-center focus:border-indigo-500 outline-none">
            
            <button onclick="checkLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">প্রবেশ করুন</button>
            <p id="errorMsg" class="text-red-500 text-sm mt-3 text-center hidden">ভুল আইডি বা পাসওয়ার্ড!</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="mainDashboard" class="hidden flex flex-col md:flex-row h-screen overflow-hidden">
        <!-- PC Sidebar -->
        <aside class="hidden md:flex w-72 bg-slate-900 text-white flex-col p-6 space-y-6">
            <h1 class="text-2xl font-black text-yellow-400 border-b border-slate-700 pb-4">হিসেবের খাতা</h1>
            <p class="text-xs text-slate-400">মেস আইডি: <span id="displayMessId" class="text-white font-bold"></span></p>
            <nav class="space-y-2 flex-1">
                <button onclick="showSection('summary')" class="nav-btn w-full text-left p-3 hover:bg-slate-800 rounded-xl transition"><i class="fas fa-home mr-3 text-blue-400"></i>ড্যাশবোর্ড</button>
                <button onclick="showSection('meals')" class="nav-btn w-full text-left p-3 hover:bg-slate-800 rounded-xl transition"><i class="fas fa-utensils mr-3 text-green-400"></i>মিল এন্ট্রি</button>
                <button onclick="showSection('deposit')" class="nav-btn w-full text-left p-3 hover:bg-slate-800 rounded-xl transition"><i class="fas fa-hand-holding-usd mr-3 text-teal-400"></i>জমা (Deposit)</button>
                <button onclick="showSection('market')" class="nav-btn w-full text-left p-3 hover:bg-slate-800 rounded-xl transition"><i class="fas fa-shopping-basket mr-3 text-yellow-400"></i>বাজার লিস্ট</button>
                <button onclick="showSection('others')" class="nav-btn w-full text-left p-3 hover:bg-slate-800 rounded-xl transition"><i class="fas fa-wallet mr-3 text-red-400"></i>অন্যান্য ব্যয়</button>
                <button onclick="showSection('members')" class="nav-btn w-full text-left p-3 hover:bg-slate-800 rounded-xl transition"><i class="fas fa-user-plus mr-3 text-purple-400"></i>মেম্বার ম্যানেজমেন্ট</button>
            </nav>
            <button onclick="logout()" class="text-gray-400 hover:text-red-400 transition text-sm pt-4 border-t border-slate-700"><i class="fas fa-sign-out-alt mr-2"></i>লগআউট</button>
        </aside>

        <!-- Main Content (Rest of the HTML stays the same as your code) -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-4 md:p-10">
            <!-- SUMMARY SECTION -->
            <section id="summary-section" class="section-content">
                <header class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-800">মেস সামারি</h2>
                    <p class="text-gray-500">চলতি মাসের আর্থিক হিসাব</p>
                </header>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-blue-500">
                        <p class="text-gray-400 text-xs font-bold uppercase">মোট বাজার</p>
                        <h3 class="text-xl font-black text-gray-800">৳ <span id="totalMarketDisplay">0</span></h3>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-green-500">
                        <p class="text-gray-400 text-xs font-bold uppercase">মোট মিল</p>
                        <h3 class="text-xl font-black text-gray-800"><span id="totalMealDisplay">0</span></h3>
                    </div>
                    <div class="bg-white p-5 rounded-2x
