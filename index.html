<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসেবের খাতা - স্বচ্ছ থাকুক আপনার হিসাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        :root {
            --primary: #f59e0b;
            --bg-light: #f8fafc;
            --card-white: #ffffff;
        }

        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: var(--bg-light);
            color: #1e293b;
            min-height: 100vh;
        }

        .premium-card {
            background: var(--card-white);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 1.5rem;
        }

        .auth-input {
            background: #ffffff !important;
            border: 2px solid #e2e8f0 !important;
            color: #1e293b !important;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
        }

        .btn-premium {
            background: var(--primary);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            background: #d97706;
            transform: translateY(-1px);
        }

        .nav-active {
            background: rgba(245, 158, 11, 0.1);
            border-right: 4px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        .sidebar {
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION -->
    <div id="authBox" class="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
        <div class="premium-card p-10 w-full max-w-md text-center">
            <h1 class="text-4xl font-bold text-amber-500 mb-2">হিসেবের খাতা</h1>
            <p class="text-gray-500 text-sm italic mb-10">স্বচ্ছ থাকুক আপনার হিসাব</p>

            <div id="loginSection" class="space-y-4">
                <input type="text" id="logId" placeholder="মেস আইডি" class="auth-input w-full p-4 rounded-2xl outline-none">
                <input type="password" id="logPass" placeholder="পাসওয়ার্ড" class="auth-input w-full p-4 rounded-2xl outline-none">
                <button onclick="processAuth('login')" class="w-full btn-premium py-4 rounded-2xl font-bold text-lg mt-4 shadow-lg shadow-amber-200">প্রবেশ করুন</button>
                <button onclick="switchView(true)" class="text-gray-500 text-sm mt-6 hover:text-amber-600 block w-full">নতুন অ্যাকাউন্ট তৈরি করুন</button>
            </div>

            <div id="regSection" class="hidden space-y-4">
                <input type="text" id="regId" placeholder="পছন্দমতো মেস আইডি" class="auth-input w-full p-4 rounded-2xl outline-none">
                <input type="password" id="regPass" placeholder="পাসওয়ার্ড সেট করুন" class="auth-input w-full p-4 rounded-2xl outline-none">
                <button onclick="processAuth('reg')" class="w-full btn-premium py-4 rounded-2xl font-bold text-lg mt-4 shadow-lg shadow-amber-200">অ্যাকাউন্ট খুলুন</button>
                <button onclick="switchView(false)" class="text-gray-500 text-sm mt-6 hover:text-amber-600 block w-full">আগের অ্যাকাউন্টে ফিরুন</button>
            </div>
            
            <p id="msgTip" class="mt-4 text-red-500 text-sm hidden font-medium"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="appContainer" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 sidebar flex flex-col p-8">
            <div class="mb-12">
                <h2 class="text-2xl font-black text-amber-500">হিসেবের খাতা</h2>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-1 font-bold">Smart Management</p>
            </div>

            <nav class="flex-1 space-y-2">
                <button onclick="changeTab('home')" id="tab-home" class="nav-active w-full text-left p-4 rounded-xl flex items-center transition">
                    <i class="fas fa-chart-pie mr-3"></i> ড্যাশবোর্ড
                </button>
                <button onclick="changeTab('members')" id="tab-members" class="w-full text-left p-4 rounded-xl flex items-center transition text-gray-500 hover:bg-gray-50">
                    <i class="fas fa-users mr-3"></i> মেম্বার ম্যানেজমেন্ট
                </button>
            </nav>

            <div class="pt-6 border-t border-gray-100">
                <div class="text-xs text-gray-400 mb-4 flex items-center font-bold uppercase">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                    ID: <span id="activeId" class="ml-1 text-slate-700"></span>
                </div>
                <button onclick="signOut()" class="text-red-500 text-sm font-bold hover:bg-red-50 transition px-4 py-2 rounded-lg w-full text-left"><i class="fas fa-sign-out-alt mr-2"></i>লগআউট</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto p-12">
            <div id="sec-home" class="tab-sec">
                <div class="flex justify-between items-end mb-12">
                    <div>
                        <h3 class="text-3xl font-bold text-slate-800">সারসংক্ষেপ</h3>
                        <p class="text-gray-500 mt-1 italic">আপনার মেসের সকল হিসাব এখানে দেখুন</p>
                    </div>
                    <div id="liveClock" class="text-amber-600 font-mono text-xl font-bold"></div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
                    <div class="premium-card p-8 border-b-4 border-amber-500">
                        <p class="text-gray-400 text-xs font-bold uppercase mb-2">বাজার খরচ</p>
                        <h4 class="text-3xl font-black text-slate-800">৳ <span id="v-market">0</span></h4>
                    </div>
                    <div class="premium-card p-8 border-b-4 border-blue-500">
                        <p class="text-gray-400 text-xs font-bold uppercase mb-2">মোট মিল</p>
                        <h4 class="text-3xl font-black text-blue-600"><span id="v-meals">0</span></h4>
                    </div>
                    <div class="premium-card p-8 border-b-4 border-purple-500">
                        <p class="text-gray-400 text-xs font-bold uppercase mb-2">মিল রেট</p>
                        <h4 class="text-3xl font-black text-purple-600">৳ <span id="v-rate">0</span></h4>
                    </div>
                    <div class="premium-card p-8 border-b-4 border-green-500">
                        <p class="text-gray-400 text-xs font-bold uppercase mb-2">মোট জমা</p>
                        <h4 class="text-3xl font-black text-green-600">৳ <span id="v-deposit">0</span></h4>
                    </div>
                </div>

                <!-- Table -->
                <div class="premium-card overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold">
                            <tr>
                                <th class="p-6">মেম্বার নাম</th>
                                <th class="p-6 text-center">মোট মিল</th>
                                <th class="p-6 text-center">জমা টাকা</th>
                                <th class="p-6 text-center">অবশিষ্ট</th>
                            </tr>
                        </thead>
                        <tbody id="memberDataRows" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <div id="sec-members" class="tab-sec hidden">
                <h3 class="text-2xl font-bold mb-8 text-slate-800">মেম্বার অ্যাড করুন</h3>
                <div class="flex gap-4 mb-12 max-w-lg">
                    <input type="text" id="inMemName" placeholder="মেম্বারের নাম লিখুন" class="auth-input flex-1 p-4 rounded-2xl outline-none">
                    <button onclick="addNewMem()" class="btn-premium px-8 rounded-2xl font-bold">অ্যাড করুন</button>
                </div>
                <div id="gridMem" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBB02NmJpHi0WS8wUv_JwGZ_scsRRNx7GA",
            authDomain: "hiseber-khata-743e5.firebaseapp.com",
            databaseURL: "https://hiseber-khata-743e5-default-rtdb.firebaseio.com",
            projectId: "hiseber-khata-743e5",
            storageBucket: "hiseber-khata-743e5.firebasestorage.app",
            messagingSenderId: "167663336335",
            appId: "1:167663336335:web:02482be99a86f90bffa9fa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let sessionMessId = "", currentData = { members: [] };

        function switchView(reg) {
            document.getElementById('loginSection').classList.toggle('hidden', reg);
            document.getElementById('regSection').classList.toggle('hidden', !reg);
        }

        async function processAuth(mode) {
            const id = document.getElementById(mode === 'reg' ? 'regId' : 'logId').value.trim().toLowerCase();
            const pass = document.getElementById(mode === 'reg' ? 'regPass' : 'logPass').value;

            if(!id || !pass) return notify("আইডি এবং পাসওয়ার্ড দিন।");

            // আপনার আগের ডাটাবেস স্ট্রাকচার অনুযায়ী পাথ সেট করা হয়েছে
            const accRef = db.ref('user_accounts/' + id);
            const snapshot = await accRef.once('value');

            if(mode === 'reg') {
                if(snapshot.exists()) return notify("এই আইডিটি ইতিমধ্যে নেওয়া হয়েছে।");
                await accRef.set({ pass: pass });
                initApp(id);
            } else {
                if(snapshot.exists() && snapshot.val().pass === pass) {
                    initApp(id);
                } else {
                    notify("ভুল আইডি অথবা পাসওয়ার্ড!");
                }
            }
        }

        function initApp(id) {
            sessionMessId = id;
            localStorage.setItem('hk_session', id);
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('activeId').innerText = id;
            
            // ডেটাবেস থেকে মেম্বার এবং হিসেব আনা (আগের স্ট্রাকচার ঠিক রাখা হয়েছে)
            db.ref('mess_storage/' + id).on('value', s => {
                const data = s.val();
                currentData = data || { members: [] };
                refreshDisplay();
            });
        }

        function refreshDisplay() {
            const grid = document.getElementById('gridMem');
            grid.innerHTML = (currentData.members || []).map(m => `
                <div class="premium-card p-6 flex justify-between items-center group transition hover:border-amber-500 shadow-sm">
                    <span class="font-bold text-lg text-slate-700">${m}</span>
                    <button onclick="removeMem('${m}')" class="text-gray-400 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');

            document.getElementById('memberDataRows').innerHTML = (currentData.members || []).map(m => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-6 font-bold text-slate-700">${m}</td>
                    <td class="p-6 text-center">0</td>
                    <td class="p-6 text-center text-green-600 font-bold">৳0</td>
                    <td class="p-6 text-center font-bold text-amber-600">৳0</td>
                </tr>
            `).join('');
        }

        function addNewMem() {
            const name = document.getElementById('inMemName').value.trim();
            if(name && !currentData.members.includes(name)) {
                if(!currentData.members) currentData.members = [];
                currentData.members.push(name);
                db.ref('mess_storage/' + sessionMessId).set(currentData);
                document.getElementById('inMemName').value = "";
            }
        }

        function removeMem(name) {
            if(confirm('মেম্বার ডিলিট করতে চান?')) {
                currentData.members = currentData.members.filter(m => m !== name);
                db.ref('mess_storage/' + sessionMessId).set(currentData);
            }
        }

        function changeTab(t) {
            document.querySelectorAll('.tab-sec').forEach(s => s.classList.add('hidden'));
            document.getElementById('sec-' + t).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('tab-' + t).classList.add('nav-active');
        }

        function notify(m) {
            const el = document.getElementById('msgTip');
            el.innerText = m; el.classList.remove('hidden');
        }

        function signOut() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem('hk_session');
            if(saved) initApp(saved);
            setInterval(() => {
                document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('bn-BD');
            }, 1000);
        };
    </script>
</body>
</html>
