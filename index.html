<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসেবের খাতা - স্বচ্ছ থাকুক আপনার হিসাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        :root {
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --dark-bg: #030712;
        }

        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background-color: var(--dark-bg); 
            color: #e5e7eb;
            overflow-x: hidden;
        }

        .premium-grad { background: var(--primary-grad); }
        .text-grad {
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.1);
        }

        .nav-link.active {
            background: var(--primary-grad);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.3);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="authScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-gray-950 to-black">
        <div class="glass-card p-10 rounded-[2.5rem] w-full max-w-md animate-in">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-bold text-grad mb-2">হিসেবের খাতা</h1>
                <p class="text-gray-400 text-sm tracking-widest">স্বচ্ছ থাকুক আপনার হিসাব</p>
            </div>

            <!-- Login View -->
            <div id="loginView" class="space-y-5">
                <div class="relative">
                    <i class="fas fa-id-badge absolute left-4 top-4 text-gray-500"></i>
                    <input type="text" id="loginId" placeholder="মেস আইডি" class="w-full pl-12 p-4 rounded-2xl outline-none text-white">
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-4 text-gray-500"></i>
                    <input type="password" id="loginPass" placeholder="পাসওয়ার্ড" class="w-full pl-12 p-4 rounded-2xl outline-none text-white">
                </div>
                <button onclick="authLogin()" class="w-full premium-grad py-4 rounded-2xl font-bold text-white hover:opacity-90 transition transform active:scale-95 shadow-xl">প্রবেশ করুন</button>
                <p class="text-center text-sm text-gray-500 mt-6">অ্যাকাউন্ট নেই? <button onclick="toggleAuth(false)" class="text-indigo-400 font-bold hover:underline">নতুন খুলুন</button></p>
            </div>

            <!-- Register View -->
            <div id="registerView" class="hidden space-y-5">
                <input type="text" id="regId" placeholder="পছন্দমতো মেস আইডি" class="w-full p-4 rounded-2xl outline-none text-white">
                <input type="password" id="regPass" placeholder="পাসওয়ার্ড" class="w-full p-4 rounded-2xl outline-none text-white">
                <input type="password" id="regPassConfirm" placeholder="পাসওয়ার্ড নিশ্চিত করুন" class="w-full p-4 rounded-2xl outline-none text-white">
                <button onclick="authRegister()" class="w-full premium-grad py-4 rounded-2xl font-bold text-white shadow-xl">একাউন্ট তৈরি করুন</button>
                <button onclick="toggleAuth(true)" class="w-full text-sm text-gray-500">আগের একাউন্টে ফিরুন</button>
            </div>
            <p id="errorMsg" class="text-red-400 text-center mt-4 text-xs font-medium hidden"></p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="mainApp" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-950 border-r border-white/5 flex flex-col p-8 hidden md:flex">
            <div class="mb-12">
                <h2 class="text-2xl font-bold text-grad">হিসেবের খাতা</h2>
                <div class="mt-2 text-[10px] uppercase tracking-tighter text-gray-500">স্বচ্ছ থাকুক আপনার হিসাব</div>
            </div>

            <nav class="flex-1 space-y-3">
                <button onclick="nav('dashboard')" id="nav-dashboard" class="nav-link active w-full flex items-center p-4 rounded-2xl transition"><i class="fas fa-chart-line mr-4"></i> ড্যাশবোর্ড</button>
                <button onclick="nav('meals')" id="nav-meals" class="nav-link w-full flex items-center p-4 rounded-2xl transition text-gray-400 hover:text-white"><i class="fas fa-calendar-check mr-4"></i> মিল এন্ট্রি</button>
                <button onclick="nav('members')" id="nav-members" class="nav-link w-full flex items-center p-4 rounded-2xl transition text-gray-400 hover:text-white"><i class="fas fa-users mr-4"></i> মেম্বার কন্ট্রোল</button>
            </nav>

            <div class="pt-6 border-t border-white/5">
                <div class="flex items-center space-x-3 mb-6">
                    <div class="w-10 h-10 rounded-full premium-grad flex items-center justify-center font-bold" id="userInitial">M</div>
                    <div>
                        <p class="text-xs text-gray-500">লগইন করা আইডি</p>
                        <p class="text-sm font-bold" id="loggedId"></p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full p-4 rounded-2xl text-red-400 hover:bg-red-500/10 transition text-left text-sm font-bold"><i class="fas fa-sign-out-alt mr-2"></i> লগআউট</button>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto p-6 md:p-12 relative">
            <!-- Header Section -->
            <div id="dashboard-section" class="tab-content animate-in">
                <div class="flex justify-between items-end mb-10">
                    <div>
                        <h3 class="text-3xl font-bold mb-2">ওভারভিউ</h3>
                        <p class="text-gray-500">আপনার মেসের বর্তমান অবস্থা</p>
                    </div>
                    <div class="hidden md:block glass-card px-6 py-3 rounded-2xl text-sm font-medium">
                        আজকের তারিখ: <span id="todayDate" class="text-indigo-400"></span>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                    <div class="glass-card p-8 rounded-[2rem]">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-4">মোট বাজার খরচ</p>
                        <h4 class="text-3xl font-black">৳ <span id="statMarket">0</span></h4>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem]">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-4">মোট মিল সংখ্যা</p>
                        <h4 class="text-3xl font-black text-indigo-400"><span id="statMeals">0</span></h4>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem]">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-4">বর্তমান মিল রেট</p>
                        <h4 class="text-3xl font-black text-grad">৳ <span id="statRate">0</span></h4>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem]">
                        <p class="text-xs font-bold text-gray-500 uppercase mb-4">অন্যান্য খরচ</p>
                        <h4 class="text-3xl font-black">৳ <span id="statOthers">0</span></h4>
                    </div>
                </div>

                <!-- Main Table -->
                <div class="glass-card rounded-[2.5rem] overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-white/5">
                            <tr class="text-xs uppercase text-gray-500">
                                <th class="p-6">নাম</th>
                                <th class="p-6 text-center">মিল</th>
                                <th class="p-6 text-center">জমা</th>
                                <th class="p-6 text-center">খরচ</th>
                                <th class="p-6 text-center">অবশিষ্ট</th>
                            </tr>
                        </thead>
                        <tbody id="summaryRows" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <!-- Members Tab -->
            <div id="members-section" class="tab-content hidden animate-in">
                <h3 class="text-2xl font-bold mb-8">মেম্বার কন্ট্রোল</h3>
                <div class="glass-card p-6 rounded-3xl max-w-md mb-10">
                    <div class="flex gap-3">
                        <input type="text" id="memNameInput" placeholder="মেম্বারের নাম (বাংলায়)" class="flex-1 p-4 rounded-2xl outline-none">
                        <button onclick="addMember()" class="premium-grad px-8 rounded-2xl font-bold shadow-lg">অ্যাড</button>
                    </div>
                </div>
                <div id="memGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <!-- Meals Tab -->
            <div id="meals-section" class="tab-content hidden animate-in">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-bold">মিল এন্ট্রি</h3>
                    <input type="date" id="mealDatePicker" class="p-3 rounded-xl glass-card outline-none text-sm">
                </div>
                <div class="glass-card p-8 rounded-[2rem] max-w-xl">
                    <div id="mealInputs" class="space-y-4"></div>
                    <button onclick="saveMeals()" class="w-full mt-8 premium-grad py-4 rounded-2xl font-bold shadow-xl">ডাটা আপডেট করুন</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase JS (Legacy for stability) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBB02NmJpHi0WS8wUv_JwGZ_scsRRNx7GA",
            authDomain: "hiseber-khata-743e5.firebaseapp.com",
            databaseURL: "https://hiseber-khata-743e5-default-rtdb.firebaseio.com",
            projectId: "hiseber-khata-743e5",
            storageBucket: "hiseber-khata-743e5.firebasestorage.app",
            messagingSenderId: "167663336335",
            appId: "1:167663336335:web:02482be99a86f90bffa9fa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let messId = "", data = { members: [], meals: {}, market: [], deposits: [], others: [] };

        // --- AUTH ---
        function toggleAuth(isLogin) {
            document.getElementById('loginView').classList.toggle('hidden', !isLogin);
            document.getElementById('registerView').classList.toggle('hidden', isLogin);
        }

        async function authRegister() {
            const id = document.getElementById('regId').value.trim().toLowerCase();
            const p1 = document.getElementById('regPass').value;
            const p2 = document.getElementById('regPassConfirm').value;

            if(!id || p1.length < 4) return err("আইডি ও ৪ অক্ষরের পাসওয়ার্ড দিন।");
            if(p1 !== p2) return err("পাসওয়ার্ড মিলেনি।");

            const check = await db.ref('mess_configs/' + id).once('value');
            if(check.exists()) return err("এই আইডি আগে কেউ নিয়েছে।");

            await db.ref('mess_configs/' + id).set({ password: p1 });
            launch(id);
        }

        async function authLogin() {
            const id = document.getElementById('loginId').value.trim().toLowerCase();
            const p = document.getElementById('loginPass').value;

            const check = await db.ref('mess_configs/' + id).once('value');
            if(check.exists() && check.val().password === p) {
                launch(id);
            } else {
                err("ভুল আইডি বা পাসওয়ার্ড।");
            }
        }

        function launch(id) {
            messId = id;
            localStorage.setItem('savedMessId', id);
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('loggedId').innerText = id;
            document.getElementById('userInitial').innerText = id[0].toUpperCase();
            
            db.ref('mess_data/' + id).on('value', snap => {
                if(snap.exists()) data = snap.val();
                if(!data.members) data.members = [];
                if(!data.meals) data.meals = {};
                sync();
            });
        }

        function err(m) {
            const e = document.getElementById('errorMsg');
            e.innerText = m;
            e.classList.remove('hidden');
        }

        // --- CORE ---
        function sync() {
            renderDashboard();
            renderMembers();
            renderMealEntry();
        }

        function renderDashboard() {
            let totalMarket = (data.market || []).reduce((a,b) => a + b.amount, 0);
            let totalOthers = (data.others || []).reduce((a,b) => a + b.amount, 0);
            let totalMeals = 0;
            let mStats = {};

            data.members.forEach(m => mStats[m] = { m: 0, d: 0 });
            
            Object.values(data.meals || {}).forEach(day => {
                for(let m in day) {
                    if(mStats[m]) { mStats[m].m += day[m]; totalMeals += day[m]; }
                }
            });

            (data.deposits || []).forEach(d => { if(mStats[d.name]) mStats[d.name].d += d.amount; });
            
            let rate = totalMeals > 0 ? (totalMarket / totalMeals) : 0;
            let fix = data.members.length > 0 ? (totalOthers / data.members.length) : 0;

            document.getElementById('statMarket').innerText = totalMarket;
            document.getElementById('statMeals').innerText = totalMeals.toFixed(1);
            document.getElementById('statRate').innerText = rate.toFixed(2);
            document.getElementById('statOthers').innerText = totalOthers;

            document.getElementById('summaryRows').innerHTML = data.members.map(m => {
                let cost = (mStats[m].m * rate) + fix;
                let bal = mStats[m].d - cost;
                return `
                    <tr class="hover:bg-white/[0.02] transition">
                        <td class="p-6 font-bold text-gray-200">${m}</td>
                        <td class="p-6 text-center">${mStats[m].m}</td>
                        <td class="p-6 text-center text-green-400 font-bold">৳${mStats[m].d}</td>
                        <td class="p-6 text-center">৳${cost.toFixed(1)}</td>
                        <td class="p-6 text-center font-black ${bal >= 0 ? 'text-indigo-400' : 'text-red-400'}">
                            ${bal >= 0 ? '+' : ''}${bal.toFixed(1)}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderMembers() {
            document.getElementById('memGrid').innerHTML = data.members.map(m => `
                <div class="glass-card p-6 rounded-2xl flex justify-between items-center group">
                    <span class="font-bold">${m}</span>
                    <button onclick="delMember('${m}')" class="text-gray-600 hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
        }

        function addMember() {
            const n = document.getElementById('memNameInput').value.trim();
            if(n && !data.members.includes(n)) {
                data.members.push(n);
                document.getElementById('memNameInput').value = "";
                push();
            }
        }

        function delMember(n) {
            if(confirm(n + " কে মেস থেকে বাদ দিবেন?")) {
                data.members = data.members.filter(m => m !== n);
                push();
            }
        }

        function renderMealEntry() {
            const d = document.getElementById('mealDatePicker').value;
            const dayData = data.meals[d] || {};
            document.getElementById('mealInputs').innerHTML = data.members.map(m => `
                <div class="flex items-center justify-between glass-card p-4 rounded-xl">
                    <span class="text-sm font-medium">${m}</span>
                    <input type="number" step="0.5" data-name="${m}" value="${dayData[m] || 0}" class="w-20 p-2 text-center rounded-lg outline-none border-none">
                </div>
            `).join('');
        }

        function saveMeals() {
            const d = document.getElementById('mealDatePicker').value;
            if(!d) return alert("তারিখ সিলেক্ট করুন।");
            const day = {};
            document.querySelectorAll('#mealInputs input').forEach(i => day[i.dataset.name] = parseFloat(i.value) || 0);
            if(!data.meals) data.meals = {};
            data.meals[d] = day;
            push();
            alert("সফলভাবে আপডেট হয়েছে!");
        }

        function push() { db.ref('mess_data/' + messId).set(data); }

        function nav(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active', 'text-white'));
            document.getElementById('nav-' + id).classList.add('active');
        }

        function logout() { localStorage.clear(); location.reload(); }

        // Auto Load
        window.onload = () => {
            document.getElementById('mealDatePicker').valueAsDate = new Date();
            document.getElementById('todayDate').innerText = new Date().toLocaleDateString('bn-BD');
            const saved = localStorage.getItem('savedMessId');
            if(saved) launch(saved);
        };
        
        document.getElementById('mealDatePicker').addEventListener('change', renderMealEntry);
    </script>
</body>
</html>
