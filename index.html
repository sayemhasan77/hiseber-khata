<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসেবের খাতা - স্বচ্ছ থাকুক আপনার হিসাব</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        :root {
            --bg-color: #0b0f1a;
            --card-bg: rgba(20, 25, 40, 0.7);
            --accent-grad: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }

        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: radial-gradient(circle at top right, #1e1b4b, #0b0f1a 50%);
            color: #f1f5f9;
            min-height: 100vh;
        }

        .premium-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .auth-input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.1);
        }

        .btn-premium {
            background: transparent;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            background: var(--accent-grad);
            color: #000;
            transform: translateY(-2px);
        }

        .nav-active {
            background: rgba(245, 158, 11, 0.1);
            border-right: 3px solid #f59e0b;
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION -->
    <div id="authBox" class="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-slate-950/80">
        <div class="premium-card p-10 rounded-[2.5rem] w-full max-w-md text-center border-t border-white/10">
            <h1 class="text-4xl font-bold text-amber-500 mb-2">হিসেবের খাতা</h1>
            <p class="text-gray-500 text-sm tracking-widest mb-10 italic">স্বচ্ছ থাকুক আপনার হিসাব</p>

            <div id="loginSection" class="space-y-4">
                <input type="text" id="logId" placeholder="মেস আইডি" class="auth-input w-full p-4 rounded-2xl outline-none">
                <input type="password" id="logPass" placeholder="পাসওয়ার্ড" class="auth-input w-full p-4 rounded-2xl outline-none">
                <button onclick="processAuth('login')" class="w-full btn-premium py-4 rounded-2xl font-bold text-lg mt-4">প্রবেশ করুন</button>
                <button onclick="switchView(true)" class="text-gray-500 text-sm mt-6 hover:text-amber-500">নতুন অ্যাকাউন্ট তৈরি করুন</button>
            </div>

            <div id="regSection" class="hidden space-y-4">
                <input type="text" id="regId" placeholder="পছন্দমতো মেস আইডি" class="auth-input w-full p-4 rounded-2xl outline-none">
                <input type="password" id="regPass" placeholder="পাসওয়ার্ড সেট করুন" class="auth-input w-full p-4 rounded-2xl outline-none">
                <input type="password" id="regConfirm" placeholder="পাসওয়ার্ড নিশ্চিত করুন" class="auth-input w-full p-4 rounded-2xl outline-none">
                <button onclick="processAuth('reg')" class="w-full btn-premium py-4 rounded-2xl font-bold text-lg mt-4">অ্যাকাউন্ট খুলুন</button>
                <button onclick="switchView(false)" class="text-gray-500 text-sm mt-6 hover:text-amber-500">আগের অ্যাকাউন্টে ফিরুন</button>
            </div>
            
            <p id="msgTip" class="mt-4 text-red-400 text-sm hidden font-medium"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="appContainer" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-slate-900/50 border-r border-white/5 flex flex-col p-8">
            <div class="mb-12">
                <h2 class="text-2xl font-black text-amber-500">হিসেবের খাতা</h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">v2.5 Stable</p>
            </div>

            <nav class="flex-1 space-y-2">
                <button onclick="changeTab('home')" id="tab-home" class="nav-active w-full text-left p-4 rounded-xl flex items-center transition">
                    <i class="fas fa-layer-group mr-3"></i> ড্যাশবোর্ড
                </button>
                <button onclick="changeTab('members')" id="tab-members" class="w-full text-left p-4 rounded-xl flex items-center transition text-gray-400 hover:text-white">
                    <i class="fas fa-user-friends mr-3"></i> মেম্বার ম্যানেজমেন্ট
                </button>
            </nav>

            <div class="pt-6 border-t border-white/5">
                <div class="text-xs text-gray-500 mb-4 flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                    ID: <span id="activeId" class="ml-1 text-white uppercase font-bold"></span>
                </div>
                <button onclick="signOut()" class="text-red-400 text-sm font-bold hover:underline">লগআউট করুন</button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto p-12">
            <!-- Home Section -->
            <div id="sec-home" class="tab-sec">
                <div class="flex justify-between items-end mb-12">
                    <div>
                        <h3 class="text-3xl font-bold">সারসংক্ষেপ</h3>
                        <p class="text-gray-500 mt-1">স্বচ্ছ থাকুক আপনার হিসাব</p>
                    </div>
                    <div id="liveClock" class="text-amber-500 font-mono text-xl"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
                    <div class="premium-card p-8 rounded-3xl border-l-4 border-amber-500">
                        <p class="text-gray-500 text-xs font-bold uppercase mb-2 tracking-widest">বাজার খরচ</p>
                        <h4 class="text-3xl font-black">৳ <span id="v-market">0</span></h4>
                    </div>
                    <div class="premium-card p-8 rounded-3xl border-l-4 border-blue-500">
                        <p class="text-gray-500 text-xs font-bold uppercase mb-2 tracking-widest">মোট মিল</p>
                        <h4 class="text-3xl font-black text-blue-400"><span id="v-meals">0</span></h4>
                    </div>
                    <div class="premium-card p-8 rounded-3xl border-l-4 border-purple-500">
                        <p class="text-gray-500 text-xs font-bold uppercase mb-2 tracking-widest">মিল রেট</p>
                        <h4 class="text-3xl font-black text-purple-400">৳ <span id="v-rate">0</span></h4>
                    </div>
                    <div class="premium-card p-8 rounded-3xl border-l-4 border-green-500">
                        <p class="text-gray-500 text-xs font-bold uppercase mb-2 tracking-widest">মোট জমা</p>
                        <h4 class="text-3xl font-black text-green-400">৳ <span id="v-deposit">0</span></h4>
                    </div>
                </div>

                <div class="premium-card rounded-[2.5rem] overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-gray-500 text-xs uppercase">
                            <tr>
                                <th class="p-6">মেম্বার নাম</th>
                                <th class="p-6 text-center">মোট মিল</th>
                                <th class="p-6 text-center">জমা টাকা</th>
                                <th class="p-6 text-center">অবশিষ্ট</th>
                            </tr>
                        </thead>
                        <tbody id="memberDataRows" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <!-- Members Section -->
            <div id="sec-members" class="tab-sec hidden">
                <h3 class="text-2xl font-bold mb-8">মেম্বার অ্যাড করুন</h3>
                <div class="flex gap-4 mb-12 max-w-lg">
                    <input type="text" id="inMemName" placeholder="মেম্বারের নাম (বাংলায় লিখুন)" class="auth-input flex-1 p-4 rounded-2xl outline-none">
                    <button onclick="addNewMem()" class="btn-premium px-8 rounded-2xl font-bold">অ্যাড</button>
                </div>
                <div id="gridMem" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <!-- SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBB02NmJpHi0WS8wUv_JwGZ_scsRRNx7GA",
            authDomain: "hiseber-khata-743e5.firebaseapp.com",
            databaseURL: "https://hiseber-khata-743e5-default-rtdb.firebaseio.com",
            projectId: "hiseber-khata-743e5",
            storageBucket: "hiseber-khata-743e5.firebasestorage.app",
            messagingSenderId: "167663336335",
            appId: "1:167663336335:web:02482be99a86f90bffa9fa"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let sessionMessId = "", currentData = { members: [] };

        function switchView(reg) {
            document.getElementById('loginSection').classList.toggle('hidden', reg);
            document.getElementById('regSection').classList.toggle('hidden', !reg);
        }

        async function processAuth(mode) {
            const id = document.getElementById(mode === 'reg' ? 'regId' : 'logId').value.trim().toLowerCase();
            const pass = document.getElementById(mode === 'reg' ? 'regPass' : 'logPass').value;

            if(!id || pass.length < 4) return notify("সঠিক আইডি ও পাসওয়ার্ড দিন।");

            const accRef = db.ref('user_accounts/' + id);
            const snapshot = await accRef.once('value');

            if(mode === 'reg') {
                if(snapshot.exists()) return notify("এই আইডিটি ইতিমধ্যে নেওয়া হয়েছে।");
                await accRef.set({ pass: pass });
                initApp(id);
            } else {
                if(snapshot.exists() && snapshot.val().pass === pass) {
                    initApp(id);
                } else {
                    notify("ভুল আইডি অথবা পাসওয়ার্ড!");
                }
            }
        }

        function initApp(id) {
            sessionMessId = id;
            localStorage.setItem('hk_session', id);
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('activeId').innerText = id;
            
            db.ref('mess_storage/' + id).on('value', s => {
                currentData = s.val() || { members: [] };
                refreshDisplay();
            });
        }

        function refreshDisplay() {
            // Member Management Grid
            const grid = document.getElementById('gridMem');
            grid.innerHTML = (currentData.members || []).map(m => `
                <div class="premium-card p-6 rounded-2xl flex justify-between items-center group transition hover:border-amber-500/30">
                    <span class="font-bold text-lg">${m}</span>
                    <button onclick="removeMem('${m}')" class="text-gray-600 hover:text-red-500 transition px-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');

            // Summary Rows
            document.getElementById('memberDataRows').innerHTML = (currentData.members || []).map(m => `
                <tr class="hover:bg-white/5 transition">
                    <td class="p-6 font-bold text-gray-200">${m}</td>
                    <td class="p-6 text-center">0</td>
                    <td class="p-6 text-center text-green-400">৳0</td>
                    <td class="p-6 text-center font-bold text-amber-500">৳0</td>
                </tr>
            `).join('');
        }

        function addNewMem() {
            const name = document.getElementById('inMemName').value.trim();
            if(name && !currentData.members.includes(name)) {
                currentData.members.push(name);
                db.ref('mess_storage/' + sessionMessId).set(currentData);
                document.getElementById('inMemName').value = "";
            }
        }

        function removeMem(name) {
            if(confirm('আপনি কি নিশ্চিতভাবে ডিলিট করতে চান?')) {
                currentData.members = currentData.members.filter(m => m !== name);
                db.ref('mess_storage/' + sessionMessId).set(currentData);
            }
        }

        function changeTab(t) {
            document.querySelectorAll('.tab-sec').forEach(s => s.classList.add('hidden'));
            document.getElementById('sec-' + t).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-white'));
            document.getElementById('tab-' + t).classList.add('nav-active', 'text-white');
        }

        function notify(m) {
            const el = document.getElementById('msgTip');
            el.innerText = m; el.classList.remove('hidden');
        }

        function signOut() { localStorage.clear(); location.reload(); }

        window.onload = () => {
            const saved = localStorage.getItem('hk_session');
            if(saved) initApp(saved);
            setInterval(() => {
                document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('bn-BD');
            }, 1000);
        };
    </script>
</body>
</html>
